[package]
name = "wasm-fuzzer"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "Reproducible, feature-exact valid WebAssembly Core and uwvm memtag generation"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
arbitrary = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
wasm-smith = { path = "vendor/wasm-smith" }
wasm-encoder = { version = "=0.263.0", features = ["wasmparser"] }
wasmparser = "=0.263.0"
wasmparser-memtag = { package = "wasmparser", path = "vendor/wasmparser-memtag" }
wat = "=1.263.0"

[profile.release]
lto = "thin"

[workspace]
members = ["."]
exclude = ["vendor/wasmparser-memtag", "vendor/wasm-smith"]
